name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0    
    - name: Install Build dependencies
      run: sudo apt-get install -y cmake cmake ninja-build build-essential libssl-dev pkg-config libboost-all-dev libsodium-dev libzmq5 libgmp-dev
    - name: Setup .NET
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies (fails on unsuppressed high/critical advisories)
      # NuGet audit runs during restore and covers transitive packages. NU1903/NU1904 are
      # high/critical advisories, NU1902 moderate; turning them into errors makes the restore
      # the vulnerability gate. If an advisory ever has to be accepted, suppress it next to the
      # package reference in the csproj as a <NuGetAuditSuppress> item with a written justification.
      run: dotnet restore src -p:NuGetAuditMode=all -warnaserror:NU1902,NU1903,NU1904
    - name: Vulnerable package report (informational, includes suppressed)
      # absolute path: some SDKs reject a relative .sln here with MSB0001 "not a rooted path"
      run: dotnet list "$GITHUB_WORKSPACE/src/Miningcore.sln" package --vulnerable --include-transitive
    - name: Build
      run: dotnet build --no-restore src
    - name: Test
      run: dotnet test --logger:"console;verbosity=detailed" --no-build --verbosity normal src
