name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0    
    - name: Install Build dependencies
      run: sudo apt-get install -y cmake cmake ninja-build build-essential libssl-dev pkg-config libboost-all-dev libsodium-dev libzmq5 libgmp-dev
    - name: Setup .NET
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore src
    - name: Check for vulnerable packages
      # dotnet list does not set a non-zero exit code on findings, so grep for them.
      run: |
        dotnet list src/Miningcore.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
        ! grep -q "has the following vulnerable packages" vulnerable.txt
    - name: Build
      run: dotnet build --no-restore src
    - name: Test
      run: dotnet test --logger:"console;verbosity=detailed" --no-build --verbosity normal src
